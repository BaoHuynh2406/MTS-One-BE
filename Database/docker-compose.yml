version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mtsone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtsone_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data


